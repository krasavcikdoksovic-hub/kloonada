<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>🎪 Цирковая Идея | KLOUNADA</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a0e0b;
      background-image: 
        radial-gradient(circle at 20% 30%, #4a1a1a 2%, transparent 2%),
        radial-gradient(circle at 80% 70%, #b22222 1%, transparent 1%),
        radial-gradient(circle at 40% 80%, #ffd700 1.5%, transparent 1.5%);
      background-size: 80px 80px, 100px 100px, 120px 120px;
      font-family: 'Comic Neue', 'Fredoka', 'Segoe UI', cursive, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      top: 0;
      bottom: 0;
      width: 25px;
      background: repeating-linear-gradient(0deg, #8b0000 0px, #8b0000 20px, #ffd700 20px, #ffd700 40px);
      z-index: 0;
      opacity: 0.7;
    }
    body::before { left: 0; }
    body::after { right: 0; }

    .circus-card {
      max-width: 680px;
      width: 100%;
      background: #fdf5e6;
      background-image: linear-gradient(45deg, #fff3e0 10%, #fff8e7 90%);
      box-shadow: 0 30px 40px rgba(0,0,0,0.6), 0 0 0 6px #ffd700, 0 0 0 12px #b22222;
      border-radius: 3rem 3rem 2.5rem 2.5rem;
      padding: 2.2rem 2rem;
      position: relative;
      z-index: 2;
      border: 3px dashed #b22222;
      transition: all 0.2s;
    }

    .circus-card::before {
      content: "★ 🎪 ★";
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffd700;
      color: #8b0000;
      font-weight: bold;
      font-size: 1.8rem;
      padding: 0.2rem 2rem;
      border-radius: 2rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      letter-spacing: 8px;
      white-space: nowrap;
    }

    @media (max-width: 500px) {
      .circus-card {
        padding: 2rem 1.2rem;
        border-radius: 2rem;
      }
      .circus-card::before {
        font-size: 1.3rem;
        padding: 0.2rem 1rem;
        letter-spacing: 4px;
      }
    }

    h1 {
      font-size: 2.3rem;
      font-weight: 700;
      color: #4a0000;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      margin-top: 0.8rem;
      margin-bottom: 0.3rem;
      text-shadow: 2px 2px 0 #ffd700;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: 'Fredoka', 'Comic Neue', cursive;
    }

    h1 i {
      color: #b22222;
      font-size: 2.2rem;
      background: #ffd700;
      padding: 0.4rem;
      border-radius: 50%;
      box-shadow: 0 0 10px gold;
    }

    .channel-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      background: #ffd700;
      color: #4a0000;
      padding: 0.5rem 1rem;
      border-radius: 3rem;
      font-weight: bold;
      font-size: 1rem;
      margin: 0.5rem 0 1.2rem;
      text-decoration: none;
      border: 2px solid #8b0000;
      transition: 0.2s;
      letter-spacing: 0.5px;
    }

    .channel-link:hover {
      background: #b22222;
      color: #ffd700;
      border-color: #ffd700;
      transform: scale(1.02);
    }

    .subtitle {
      background: #b22222;
      color: #ffd700;
      font-weight: bold;
      padding: 0.7rem 1.2rem;
      border-radius: 2rem;
      margin-bottom: 1.8rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
      border: 2px dotted #ffd700;
    }

    .form-group {
      margin-bottom: 1.6rem;
    }

    label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1rem;
      color: #4a0000;
      margin-bottom: 0.5rem;
    }

    label i {
      color: #b22222;
      font-size: 1.2rem;
      background: #ffd700;
      padding: 0.3rem;
      border-radius: 50%;
    }

    .required-star {
      color: #b22222;
      font-size: 1.4rem;
      margin-left: 0.2rem;
    }

    input, textarea {
      width: 100%;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      font-family: inherit;
      border: 2px solid #b22222;
      border-radius: 1.5rem;
      background: #fffef7;
      outline: none;
      color: #2d0a0a;
      transition: 0.2s;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
    }

    textarea {
      resize: vertical;
      min-height: 110px;
    }

    input:focus, textarea:focus {
      border-color: #ffd700;
      box-shadow: 0 0 0 5px rgba(255,215,0,0.5), inset 0 1px 8px rgba(0,0,0,0.1);
      background: #ffffff;
    }

    .file-upload-area {
      border: 3px dashed #b22222;
      border-radius: 1.5rem;
      padding: 1.5rem 1rem;
      text-align: center;
      background: #ffefd5;
      cursor: pointer;
      transition: 0.2s;
      position: relative;
    }

    .file-upload-area i {
      font-size: 2.8rem;
      color: #b22222;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2));
    }

    .file-upload-area:hover {
      background: #ffd700;
      border-color: #8b0000;
    }

    .file-upload-text {
      font-weight: 700;
      color: #4a0000;
      font-size: 1rem;
    }

    .file-hint {
      color: #5a2e2e;
      font-weight: 500;
      font-size: 0.8rem;
    }

    #file-input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      cursor: pointer;
    }

    .file-list {
      margin-top: 0.8rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .file-chip {
      background: #b22222;
      color: #ffd700;
      padding: 0.4rem 1rem;
      border-radius: 2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      border: 1px solid #ffd700;
    }

    .remove-file-btn {
      background: none;
      border: none;
      color: #ffd700;
      cursor: pointer;
      font-size: 1rem;
    }

    .error-message {
      color: #ffd700;
      background: #b22222;
      font-weight: bold;
      padding: 0.4rem 0.8rem;
      border-radius: 1rem;
      margin-top: 0.4rem;
      font-size: 0.8rem;
    }

    .btn-submit {
      background: #b22222;
      color: #ffd700;
      border: 3px solid #ffd700;
      width: 100%;
      padding: 1rem;
      font-weight: 800;
      font-size: 1.2rem;
      border-radius: 2rem;
      cursor: pointer;
      transition: 0.2s;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 8px 0 #4a0000;
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      background: #ffd700;
      color: #b22222;
      border-color: #b22222;
      transform: translateY(-2px);
      box-shadow: 0 10px 0 #4a0000;
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: 0 4px 0 #4a0000;
    }

    .success-message {
      background: #ffd700;
      color: #4a0000;
      font-weight: bold;
      padding: 1rem;
      border-radius: 1.5rem;
      margin-top: 1.5rem;
      border: 2px solid #b22222;
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #ffd700;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="circus-card">
  <h1>
    <i class="fas fa-hat-wizard"></i> ИДЕЯ ДЛЯ ПОСТА
  </h1>

  <a href="https://t.me/Klounada_WePlay" target="_blank" class="channel-link">
    <i class="fab fa-telegram-plane"></i> t.me/Klounada_WePlay
  </a>

  <div class="subtitle">
    <i class="fas fa-star"></i> Без доказательств идея улетит в цирковой провал!
  </div>

  <form id="idea-form">
    <div class="form-group">
      <label><i class="fas fa-pencil-alt"></i> Суть идеи <span class="required-star">*</span></label>
      <textarea id="idea-text" placeholder="Опишите цирковую идею..."></textarea>
      <div id="idea-error" class="error-message hidden">🃏 Минимум 10 символов!</div>
    </div>

    <div class="form-group">
      <label><i class="fas fa-file-image"></i> Доказательства <span class="required-star">*</span></label>
      <div class="file-upload-area" id="drop-area">
        <i class="fas fa-upload"></i>
        <span class="file-upload-text">Загрузите файлы</span>
        <span class="file-hint">JPG, PNG, PDF, DOCX (до 10 МБ)</span>
        <input type="file" id="file-input" multiple accept="image/*,.pdf,.doc,.docx,.zip,.txt">
      </div>
      <div id="file-list" class="file-list"></div>
      <div id="file-error" class="error-message hidden">🎪 Прикрепите хотя бы один файл!</div>
    </div>

    <div class="form-group">
      <label><i class="fas fa-link"></i> Ссылка (необязательно)</label>
      <input type="url" id="source-link" placeholder="https://...">
    </div>

    <button type="submit" class="btn-submit" id="submit-btn">
      <i class="fas fa-paper-plane"></i> Отправить в Telegram
    </button>
  </form>

  <div id="success-box" class="success-message hidden">
    🎉 Идея улетела в @Klounada_WePlay!
  </div>
</div>

<script>
  (function() {
    // ⚙️ НАСТРОЙКИ TELEGRAM
    const BOT_TOKEN = '8329703757:AAFBVjiXnkvQ0vcMBNw1uztVjzcF4xqTUtM';
    // Пока оставляем пустым - получим автоматически
    let CHAT_ID = '';

    const form = document.getElementById('idea-form');
    const ideaTextarea = document.getElementById('idea-text');
    const fileInput = document.getElementById('file-input');
    const fileListContainer = document.getElementById('file-list');
    const ideaError = document.getElementById('idea-error');
    const fileError = document.getElementById('file-error');
    const successBox = document.getElementById('success-box');
    const sourceInput = document.getElementById('source-link');
    const submitBtn = document.getElementById('submit-btn');

    let selectedFiles = [];

    // Функция для автоматического получения chat_id
    async function getChatId() {
      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`);
        const data = await response.json();
        
        if (data.ok && data.result.length > 0) {
          // Берем chat_id из последнего сообщения
          const lastMessage = data.result[data.result.length - 1];
          if (lastMessage.message && lastMessage.message.chat) {
            CHAT_ID = lastMessage.message.chat.id;
            console.log('✅ Chat ID найден:', CHAT_ID);
            return true;
          }
        }
        
        console.warn('⚠️ Chat ID не найден. Напишите боту сообщение!');
        return false;
      } catch (err) {
        console.error('Ошибка получения chat_id:', err);
        return false;
      }
    }

    // Пытаемся получить chat_id при загрузке
    getChatId().then(found => {
      if (!found) {
        // Показываем инструкцию
        const instruction = document.createElement('div');
        instruction.style.cssText = `
          background: #fff3cd;
          color: #856404;
          padding: 1rem;
          border-radius: 1rem;
          margin-bottom: 1rem;
          border: 2px solid #ffc107;
          font-weight: bold;
        `;
        instruction.innerHTML = `
          🔧 <strong>Внимание!</strong> Для работы нужно:<br>
          1. Открыть бота: <a href="https://t.me/Klounada_WePlay_bot" target="_blank">@Klounada_WePlay_bot</a><br>
          2. Написать любое сообщение (например, "Привет")<br>
          3. Обновить эту страницу
        `;
        form.insertBefore(instruction, form.firstChild);
      }
    });

    function updateFileList() {
      fileListContainer.innerHTML = '';
      selectedFiles.forEach((f, i) => {
        const chip = document.createElement('div');
        chip.className = 'file-chip';
        chip.innerHTML = `📎 ${f.name} <button class="remove-file-btn" data-index="${i}">✕</button>`;
        fileListContainer.appendChild(chip);
      });
      document.querySelectorAll('.remove-file-btn').forEach(b => {
        b.addEventListener('click', (e) => {
          const idx = parseInt(e.currentTarget.getAttribute('data-index'), 10);
          selectedFiles.splice(idx, 1);
          syncInput();
          updateFileList();
          if (selectedFiles.length) fileError.classList.add('hidden');
        });
      });
    }

    function syncInput() {
      const dt = new DataTransfer();
      selectedFiles.forEach(f => dt.items.add(f));
      fileInput.files = dt.files;
    }

    function addFiles(files) {
      Array.from(files).forEach(f => {
        if (f.size > 10 * 1024 * 1024) {
          alert(`🎪 Файл "${f.name}" больше 10 МБ и не будет добавлен!`);
        } else {
          selectedFiles.push(f);
        }
      });
      syncInput();
      updateFileList();
      if (selectedFiles.length) fileError.classList.add('hidden');
    }

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        addFiles(fileInput.files);
      }
    });

    const dropArea = document.getElementById('drop-area');
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropArea.addEventListener(eventName, ev => ev.preventDefault());
    });
    dropArea.addEventListener('drop', e => {
      if (e.dataTransfer.files.length > 0) {
        addFiles(e.dataTransfer.files);
      }
    });

    ideaTextarea.addEventListener('input', () => {
      if (ideaTextarea.value.trim().length >= 10) ideaError.classList.add('hidden');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      ideaError.classList.add('hidden');
      fileError.classList.add('hidden');
      successBox.classList.add('hidden');

      const text = ideaTextarea.value.trim();
      let valid = true;

      if (text.length < 10) {
        ideaError.classList.remove('hidden');
        valid = false;
        ideaTextarea.focus();
      }

      if (selectedFiles.length === 0) {
        fileError.classList.remove('hidden');
        valid = false;
      }

      if (!valid) return;

      // Проверяем chat_id
      if (!CHAT_ID) {
        await getChatId();
        if (!CHAT_ID) {
          alert('🎪 Сначала напишите боту!\n\n1. Откройте @Klounada_WePlay_bot\n2. Напишите любое сообщение\n3. Обновите страницу');
          return;
        }
      }

      // Показываем загрузку
      submitBtn.disabled = true;
      const originalHTML = submitBtn.innerHTML;
      submitBtn.innerHTML = '<span class="loading-spinner"></span> Отправляем...';

      try {
        // Отправляем ВСЕ файлы в одном сообщении через sendMediaGroup
        if (selectedFiles.length === 1) {
          // Один файл - sendDocument
          const formData = new FormData();
          formData.append('chat_id', CHAT_ID);
          formData.append('caption', `🎪 *Новая идея для поста!*\n\n📝 ${text}\n🔗 ${sourceInput.value.trim() || 'нет ссылки'}`);
          formData.append('parse_mode', 'Markdown');
          formData.append('document', selectedFiles[0]);

          const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
            method: 'POST',
            body: formData
          });

          if (!response.ok) throw new Error('Ошибка отправки');
        } else {
          // Несколько файлов - отправляем первый с текстом, остальные без
          for (let i = 0; i < selectedFiles.length; i++) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            
            if (i === 0) {
              formData.append('caption', `🎪 *Новая идея для поста!*\n\n📝 ${text}\n🔗 ${sourceInput.value.trim() || 'нет ссылки'}\n📎 Файл ${i + 1}/${selectedFiles.length}`);
              formData.append('parse_mode', 'Markdown');
            } else {
              formData.append('caption', `📎 Файл ${i + 1}/${selectedFiles.length}`);
            }
            
            formData.append('document', selectedFiles[i]);

            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
              method: 'POST',
              body: formData
            });

            if (!response.ok) {
              const err = await response.json();
              throw new Error(err.description || 'Ошибка отправки');
            }
          }
        }

        // Успех!
        successBox.classList.remove('hidden');
        form.reset();
        selectedFiles = [];
        syncInput();
        updateFileList();

        setTimeout(() => {
          successBox.classList.add('hidden');
        }, 5000);

      } catch (err) {
        console.error('Ошибка:', err);
        alert('🎪 Ошибка отправки!\n\n' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalHTML;
      }
    });
  })();
</script>
</body>
</html>
